# The printed copy, keyed exactly as `brand_materials/lib.typ`'s `card()` takes it.
# Read by `brand_materials/__main__.typ` (typst `toml()`) and by `flake.nix`, which
# emits the vCards from the same fields. Every material draws from this one table;
# the card is the material that needs all of it.
#
# Global keys are one person's and read the same in every language; a `langs`
# entry is what a reader parses, so it is translated. Adding a language needs a
# `_labels` entry in lib.typ too — the chrome belongs to the design.

